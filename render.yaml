# Render Blueprint — free-tier deploy for the Nakshatra Astro-AI backend.
#
# Usage:
#   1. Push this repo to GitHub (if not already).
#   2. On render.com: New > Blueprint > connect this repo > Render reads this file automatically.
#   3. After the service is created, go to its Environment tab and fill in the "sync: false"
#      variables below with your real values (never commit secrets to this file).
#   4. Copy the resulting service URL (https://<name>.onrender.com) into VITE_API_URL when you
#      build the Android app.
#
# Free tier note: Render's free web services spin down after ~15 minutes of inactivity and take
# ~30-50s to wake on the next request. Fine for a low-traffic personal app; if that cold start
# is a problem, Render's paid tier ($7/mo) keeps it always-on.

services:
  - type: web
    name: nakshatra-astro-ai-server
    runtime: node
    plan: free
    region: singapore # closest free region to India as of writing; change if needed
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 3001
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: APP_SECRET_TOKEN
        sync: false
      - key: NASA_API_KEY
        value: DEMO_KEY
